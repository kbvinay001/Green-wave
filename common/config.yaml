# Green Wave++ Configuration

audio:
  sample_rate: 16000
  n_mels: 128
  n_fft: 1024
  win_length: 400  # 25 ms at 16kHz
  hop_length: 160  # 10 ms at 16kHz
  fmin: 0
  fmax: 8000
  window_sec: 1.0
  hop_sec: 0.1

  # Real-data ingestion (audio/prepare_real_data.py)
  real_data:
    root: "audio/data/real"
    window_sec: 3.0          # training window length
    window_hop_sec: 1.5      # stride between windows within one recording
    min_rms_dbfs: -45.0      # discard near-silent windows
    val_fraction: 0.15       # source-recording-level split (no window leakage)
    seed: 42
    max_windows_per_origin: 8     # cap windows per source recording (diversity)
    max_neg_per_pos: 1.5          # cap negative:positive window ratio
    urbansound_negative_classes: [car_horn, drilling, engine_idling, street_music]
    sources:
      evss:      # Emergency Vehicle Siren Sounds (Kaggle, CC0)
        url: "https://www.kaggle.com/api/v1/datasets/download/vishnu0399/emergency-vehicle-siren-sounds"
        archive: "evss.zip"
      sirennet:  # sireNNet (Mendeley j4ydzzv4kb v1, CC BY 4.0)
        url: "https://data.mendeley.com/public-files/datasets/j4ydzzv4kb/files/486fe1d9-9e0f-44cd-8ed9-aafaee2ebcac/file_downloaded"
        archive: "sirennet.zip"
      lssiren:   # LSSiren - Large-Scale Emergency Vehicle Siren + Road Noise (figshare 17560865 -> Google Drive)
        gdrive_folder: "1_frynXRNmlB7_HwmSV6UDIIYXF2PSULu"
        archive: "lssiren"  # downloaded as a folder via gdown
      urbansound8k:  # UrbanSound8K (Zenodo 1203745, CC BY-NC)
        url: "https://zenodo.org/record/1203745/files/UrbanSound8K.tar.gz?download=1"
        archive: "UrbanSound8K.tar.gz"
  
  # SpecAugment
  freq_mask_param: 20
  time_mask_param: 30
  
  # TDOA/Bearing
  mic_array:
    positions: [[0.0, 0.0], [0.15, 0.0], [0.075, 0.13]]  # triangle, 15 cm baseline
  bearing_median_window: 5  # 0.5 s @ 10 Hz

  # Doppler gate: a receding siren (falling pitch trend) is weighted down.
  # Sirens sweep, so we track the max frequency per block (the sweep's upper
  # envelope) and look at its drift -- not the raw pitch, which oscillates.
  doppler:
    enabled: true
    window_sec: 2.0            # how much history the trend uses
    block_sec: 0.5             # envelope sample size
    band_hz: [500, 2500]       # where sirens live
    falling_slope_hz_per_s: -10.0   # steeper fall than this = receding
    receding_factor: 0.3       # belief contribution multiplier when receding
  
vision:
  model: "yolov11s"
  weights: "vision/weights/yolov11s-ambulance.pt"
  dataset_yaml: "vision/ambulance.yaml"
  img_size: 640
  conf_threshold: 0.4
  iou_threshold: 0.5
  classes: ["ambulance"]   # dataset labels contain only class 0
  fps_target: 25
  
fusion:
  decay_factor: 0.92
  sigma_angle_deg: 20.0
  arm_threshold: 0.6
  arm_duration_sec: 0.5
  preempt_threshold: 0.8
  preempt_threshold_approaching: 0.7
  min_visual_speed_kmh: 30.0
  # Cross-modal gate: a siren alone can never fire a full preemption.
  # Belief stays capped below preempt_threshold until the camera has
  # confirmed an ambulance on that lane within the last few seconds.
  audio_only_belief_cap: 0.7
  vision_confirm_window_sec: 3.0
  # Graded action: the moment a lane arms (belief crosses arm_threshold),
  # the nearest corridor signal gets its current green stretched by this
  # much -- a cheap early move while we wait for full confirmation.
  arm_green_extension_sec: 5.0
  
sumo:
  step_length: 0.1  # 100 ms
  all_red_duration: 2.5
  preempt_green_duration: 12.0
  downstream_lookahead: 3  # intersections
  cfg: ""        # path to a .sumocfg -> real TraCI control; empty = mock signals
  gui: false     # open the SUMO window when cfg is set

# Virtual sensor mode (run.py --virtual): replay a video + WAV as if they
# were the live camera + microphone, time-synchronized on one media clock.
virtual:
  video: ""                      # path to video file ("" = no vision source)
  wav: "audio/data/test/sirens/test_siren.wav"
  camera_lane: "approach_west"   # the approach this (single) camera watches
  audio_bearing_deg: null        # null = use camera_lane's heading; or fixed degrees
  speed: 1.0                     # playback speed multiplier
  loop: false                    # restart sources when files end
  # A monocular uncalibrated camera cannot measure speed/distance reliably;
  # these defaults stand in when the pixel tracker has no answer yet.
  assume_approaching: true       # count detections without velocity history
  default_speed_kmh: 50.0        # used when tracker speed is unavailable
  pixels_per_meter: 10.0         # tracker speed calibration (rough)
  
# Real intersection: Benz Circle, Vijayawada (OSM extract, see sim/nets/benz_circle).
# The ambulance approaches from the west on MG Road and exits SE on Bandar Road.
# Junction ids come from netconvert; distance_m is measured from the FIRST
# corridor junction (RoutePredictor adds the vehicle's distance to that one).
# OSM has no signal tags here, so signals were forced at these four junctions
# with netconvert --tls.set (see sim/build_corridor.py output).
intersection:
  corridors:
    - lane_id: approach_west
      heading_deg: 270
      intersections:
        - {id: "cluster_2833253614_4649948643", distance_m: 0,   approach_edge: "279067605#8"}
        - {id: "cluster_3496483757_4461930878", distance_m: 158, approach_edge: "350502993#11"}
        - {id: "cluster_3777691603_3777721158", distance_m: 384, approach_edge: "374387203#0"}
        - {id: "cluster_6154156987_9647693957", distance_m: 831, approach_edge: "657054233#1"}

system:
  log_dir: "logs"
  output_dir: "outputs"
  checkpoint_dir: "checkpoints"
